<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зубр</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зубр">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E4EAF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131B2C" media="(prefers-color-scheme: dark)">
<style>
:root{
  --paper:#E4EAF0; --card:#FCFDFE; --ink:#17233B; --ink2:#55647E; --line:#C2CEDC; --rule:#D6E0EB;
  --red:#CF5560; --accent:#2B47C2; --accent-ink:#FFFFFF;
  --ok:#1B7F56; --ok-ink:#FFFFFF; --ok-bg:#DFF1E8; --bad:#B93A35; --bad-ink:#FFFFFF; --bad-bg:#F8E3E1;
  --shade:rgba(23,35,59,.22);
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --lh:2.125rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131B2C; --card:#1D2840; --ink:#E9EEF6; --ink2:#9CAAC1; --line:#34435F; --rule:#2B3954;
    --red:#E0727A; --accent:#93A8FF; --accent-ink:#0F1730;
    --ok:#55C792; --ok-ink:#0C2A1D; --ok-bg:#173A2F; --bad:#F27E76; --bad-ink:#3A0F0C; --bad-bg:#44252A;
    --shade:rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;text-align:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,p{margin:0}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:calc(env(safe-area-inset-top,0px) + 54px)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 28px}
.dock{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.view.tabbed .dock{padding-bottom:12px}
.tabs{display:none;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs.on{display:flex}
.tabs button{flex:1;padding:13px 4px;font-size:.875rem;color:var(--ink2);text-align:center}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--ink)}

.word{font:600 1.0625rem var(--serif);letter-spacing:.01em}
.who{font-size:.8125rem;color:var(--ink2);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 14px}
.chips button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:.875rem;min-height:38px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip{font-size:.8125rem;color:var(--ink2);padding:8px 0 8px 12px;text-align:right}
.chip.warn{color:var(--bad)}
.lead{font:600 1.875rem/1.15 var(--serif);margin:10px 0 6px;text-wrap:balance}
.sub{color:var(--ink2);margin-bottom:22px}
.hint{font-size:.875rem;color:var(--ink2)}
.h2{font:600 1.0625rem var(--sans);margin:26px 0 8px}

.btn{display:block;width:100%;min-height:54px;padding:14px 18px;border-radius:14px;font-weight:600;font-size:1.0625rem;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.quiet{border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.bad{background:var(--bad);color:var(--bad-ink)}
.btn:active{opacity:.82}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--accent);padding:10px 0;text-align:center;font-size:.9375rem;width:100%}
.link.left{text-align:left;width:auto}
.link.danger{color:var(--bad)}

/* коробки Лейтнера: карточки стоят ребром в отделениях */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 10px}
.box{text-align:center}
.box .well{height:52px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 6px 6px;display:flex;align-items:flex-end;padding:0 5px 4px}
.box .stack{width:100%;height:calc(var(--n) * 4px);background:repeating-linear-gradient(to top,var(--ink) 0 2px,transparent 2px 4px)}
.box b{display:block;font:600 1.0625rem var(--serif);margin-top:6px}
.box span{display:block;font-size:.75rem;color:var(--ink2)}

.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);min-height:50px}
.row .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink2)}
.row[aria-pressed="true"] .dot{border:5.5px solid var(--accent)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row[aria-pressed="true"] .t{font-weight:600}
.row.sub-row{padding-left:28px}
.row.sub-row .t{font-size:.9375rem}
.cnt{flex:none;font-size:.875rem;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.cnt.fresh{color:var(--ink2)}
.row .go{color:var(--ink2);flex:none}
.prow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.prow .row{border-bottom:0;flex:1;min-width:0}
.fold{flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 12px;color:var(--ink2);font-size:.8125rem;min-width:52px;justify-content:flex-end;border-left:1px solid var(--rule)}
.fold i{font-style:normal;font-size:1.25rem;line-height:1;display:inline-block;transition:transform .15s}
.fold[aria-expanded="true"] i{transform:rotate(90deg)}
.row .acts{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .acts .link{width:auto;padding:6px 0;font-size:.875rem}
.pill{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--accent);color:var(--accent);font-size:.875rem;font-weight:600;min-height:38px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tag2{display:inline-block;font-size:.75rem;font-weight:600;color:var(--ok);margin-top:2px}
.tag2.wait{color:var(--ink2)}
.cred{background:var(--card);border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;margin:12px 0;font:.9375rem/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}

.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.9375rem;padding:2px 0}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}

.notice{border-left:3px solid var(--red);padding:8px 12px;margin:0 0 18px;font-size:.875rem;background:var(--card);border-radius:0 6px 6px 0}

/* карточка: красная линия и линовка как у каталожной */
.bar{height:3px;background:var(--line);margin:0 20px 14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0}
.icard{background:var(--card);border-radius:6px;box-shadow:0 0 0 1px var(--line),0 14px 26px -18px var(--shade);overflow:hidden}
.icard-head{padding:11px 18px 8px;font-size:.8125rem;color:var(--ink2);border-bottom:2px solid var(--red)}
.icard-q{padding:0 18px var(--lh);min-height:calc(var(--lh) * 4);font:1.25rem/var(--lh) var(--serif);overflow-wrap:anywhere;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh))}
.icard.compact .icard-q{min-height:calc(var(--lh) * 2)}
.icard-a{padding:16px 18px 18px;border-top:1.5px dashed var(--line);font:1.125rem/1.5 var(--serif);overflow-wrap:anywhere}
.icard-a p+p,.note p+p{margin-top:.6em}
.reveal{animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{margin-top:16px;font-size:.9375rem;line-height:1.5;overflow-wrap:anywhere}
.note h3{font-size:.8125rem;font-weight:600;color:var(--ink2);margin-bottom:4px}
.src{margin-top:12px;font-size:.875rem;color:var(--ink2)}
.verdict{margin-top:16px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:1rem/1.4 var(--serif);min-height:54px;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt .tag{display:block;font:600 .75rem var(--sans);margin-bottom:3px}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}

.field{display:grid;gap:6px;margin-bottom:14px}
.field span{font-size:.875rem;font-weight:600}
.field small{font-size:.8125rem;color:var(--ink2)}
.field input{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{font-size:.875rem;color:var(--ink2);margin:4px 0}
.kv b{color:var(--ink);font-weight:600}
.err{color:var(--bad);font-size:.875rem;margin:8px 0}
.stackv{display:grid;gap:10px}

.prose{font:1.0625rem/1.6 var(--serif);overflow-wrap:anywhere}
.prose h1{font-size:1.625rem;line-height:1.2;margin:4px 0 14px}
.prose h2{font-size:1.3125rem;line-height:1.25;margin:28px 0 10px;padding-top:10px;border-top:2px solid var(--red)}
.prose h3{font-size:1.125rem;margin:22px 0 8px}
.prose p,.prose ul,.prose ol,.prose blockquote,.prose pre,.prose .tw,.prose .diagram{margin:0 0 14px}
.prose ul,.prose ol{padding-left:1.3em}
.prose li+li{margin-top:4px}
.prose blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--ink2)}
.prose code{font:.875em ui-monospace,Menlo,monospace;background:var(--rule);padding:1px 5px;border-radius:4px}
.prose pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose img,.prose svg{max-width:100%;height:auto}
.prose .tw,.prose .diagram{overflow-x:auto}
.prose .diagram{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;overflow-wrap:normal;font:1rem/1.4 var(--sans)}
.prose .diagram svg{max-width:none}
.prose table{border-collapse:collapse;font:.9375rem/1.4 var(--sans);overflow-wrap:normal}
.prose th,.prose td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--rule)}
.prose hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--rule)}to{background:transparent}}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;font-size:.9375rem;width:max-content;max-width:calc(100% - 40px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section class="view tabbed" id="v-home"></section>
  <section class="view" id="v-review"></section>
  <section class="view tabbed" id="v-materials"></section>
  <section class="view" id="v-reader"></section>
  <section class="view tabbed" id="v-catalog"></section>
  <section class="view tabbed" id="v-settings"></section>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button data-act="tab" data-view="home">Карточки</button>
    <button data-act="tab" data-view="materials">Материалы</button>
    <button data-act="tab" data-view="catalog">Каталог</button>
    <button data-act="tab" data-view="settings">Настройки</button>
  </nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,.md,application/json,text/markdown,text/plain" multiple hidden>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
'use strict';
/* ---------- утилиты ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; };
const cardsWord = n => n + ' ' + plural(n, ['карточка', 'карточки', 'карточек']);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };
const slug = s => String(s).trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '');
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const niceDate = s => { const [, m, d] = s.split('-').map(Number); return d + ' ' + MONTHS[m - 1]; };
function b64(str) { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function md(text) { try { return DOMPurify.sanitize(marked.parse(String(text), { breaks: true })); } catch { return esc(text).replace(/\n/g, '<br>'); } }
function mdi(text) { try { return DOMPurify.sanitize(marked.parseInline(String(text), { breaks: true })); } catch { return esc(text).replace(/\n/g, '<br>'); } }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }

/* ---------- хранилище на телефоне (IndexedDB) ---------- */
const DB = {
  _p: null,
  open() { return this._p ||= new Promise((res, rej) => { const r = indexedDB.open('zubr', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
};
const S = {
  settings: { mode: '', repo: '', token: '', profile: '', profiles: [], server: '', login: '', session: '', admin: false, sessionSize: 20, newPerSession: 10, options: false, scope: { pack: null, topic: null } },
  packs: {},      // путь -> { key, src:'repo'|'file', sha, id, title, cards:[] }
  materials: {},  // путь -> { path, src, sha, text }
  images: {},     // путь -> { sha, url }
  progress: {},   // id карточки -> { box, due, ts, ok, bad }
  subs: { ids: [], ts: 0 },   // какие паки каталога скачаны (режим сервера)
  sync: { last: 0, dirty: false, progressSha: '', error: '', reset: false }
};
let storageBroken = false;
const SYNC0 = { last: 0, dirty: false, progressSha: '', error: '', reset: false };
const serverMode = () => S.settings.mode === 'server';
const profKey = () => serverMode() ? (S.settings.login ? 'u-' + S.settings.login : '') : slug(String(S.settings.profile || '').normalize('NFC'));   // '' - основной профиль
const pKey = k => (k === 'progress' || k === 'sync' || k === 'subs') && profKey() ? k + ':' + profKey() : k;   // прогресс у каждого профиля свой
const progressPath = () => profKey() ? 'progress/' + profKey() + '.json' : 'progress.json';
async function save(key) { try { await DB.set(pKey(key), S[key]); } catch (e) { if (!storageBroken) { storageBroken = true; toast('Телефон не даёт сохранять данные. Проверь свободное место.'); } } }
async function loadAll() {
  for (const k of Object.keys(S)) {
    try { const v = await DB.get(pKey(k)); if (v && typeof v === 'object') S[k] = k === 'settings' || k === 'sync' ? { ...S[k], ...v } : v; } catch { storageBroken = true; }
  }
  if (!S.settings.scope) S.settings.scope = { pack: null, topic: null };
}
async function switchProfile(name) {
  S.settings.profile = name; await save('settings');
  await loadProfile();
}
async function loadProfile() {
  let p = null, y = null;
  try { p = await DB.get(pKey('progress')); y = await DB.get(pKey('sync')); } catch {}
  let u = null; try { u = await DB.get(pKey('subs')); } catch {}
  S.progress = p && typeof p === 'object' ? p : {};
  S.subs = u && Array.isArray(u.ids) ? u : { ids: [], ts: 0 };
  S.sync = { ...SYNC0, ...(y && typeof y === 'object' ? y : {}), error: '' };
  if (Object.keys(S.progress).length && !S.sync.last) S.sync.dirty = true;
}

/* ---------- паки и карточки ---------- */
const INTERVALS = [0, 1, 2, 4, 8, 16];
const BOX_LABEL = ['', '1 день', '2 дня', '4 дня', '8 дней', '16 дней'];
function normPack(raw, fallbackId) {
  if (!raw || !Array.isArray(raw.cards)) throw new Error('в файле нет списка cards');
  const meta = raw.pack || {};
  const id = String(meta.id || raw.id || fallbackId);
  const seen = new Set(), cards = [];
  for (const c of raw.cards) {
    if (!c || c.q == null || c.a == null || String(c.q).trim() === '') continue;
    let cid = c.id != null && String(c.id) !== '' ? String(c.id) : id + ':' + hash(String(c.q));
    while (seen.has(cid)) cid += '~';
    seen.add(cid);
    cards.push({ id: cid, topic: String(c.topic || 'Без темы'), q: String(c.q), a: String(c.a), explain: c.explain ? String(c.explain) : '',
      options: Array.isArray(c.options) ? c.options.map(String) : [], source: c.source ? String(c.source) : '', material: c.material ? String(c.material) : '' });
  }
  return { id, title: String(meta.title || raw.title || id), cards };
}
let IDX = { cards: [] };
function reindex() {
  const cards = [];
  for (const key of Object.keys(S.packs).sort()) { const p = S.packs[key]; for (const c of p.cards) cards.push({ ...c, packKey: key, packTitle: p.title }); }
  IDX = { cards };
  const sc = S.settings.scope;
  if (sc.pack && !S.packs[sc.pack]) S.settings.scope = { pack: null, topic: null };
  else if (sc.pack && sc.topic && !S.packs[sc.pack].cards.some(c => c.topic === sc.topic)) sc.topic = null;
}
function scopeCards(sc) { let cs = IDX.cards; if (sc.pack) cs = cs.filter(c => c.packKey === sc.pack); if (sc.topic) cs = cs.filter(c => c.topic === sc.topic); return cs; }
function counts(cs) { const t = today(); let due = 0, fresh = 0; for (const c of cs) { const p = S.progress[c.id]; if (!p) fresh++; else if (p.due <= t) due++; } return { due, fresh, total: cs.length }; }
function buildSession(sc, kind) {
  const cs = scopeCards(sc), t = today();
  if (kind === 'all') return shuffle(cs.slice());

async function syncGithub(opts) {

    }

const lastSyncText = () => (S.sync.last ? 'Последняя синхронизация: <b>' + niceDate(ymd(new Date(S.sync.last))) + ', ' + pad(new Date(S.sync.last).getHours()) + ':' + pad(new Date(S.sync.last).getMinutes()) + '</b>' : 'Синхронизации ещё не было.') + (S.sync.dirty ? ' Есть неотправленные ответы.' : '');
function renderSettings() {
  const el = $('#v-settings'), s = S.settings;
  const packs = Object.values(S.packs).sort((a, b) => a.key.localeCompare(b.key));
  const nMat = Object.keys(S.materials).length, nProg = Object.keys(S.progress).length;
  const mode = SETMODE || (s.mode === 'github' || (!s.mode && s.repo && s.token) ? 'github' : 'server');
  el.innerHTML = topBar() + `<div class="scroll">
    <h1 class="lead">Настройки</h1>
    <h2 class="h2">Аккаунт</h2>
    ${configured() ? '' : `<div class="chips" aria-label="Способ входа"><button data-act="setmode" data-m="server" aria-pressed="${mode === 'server'}">Логин и пароль</button><button data-act="setmode" data-m="github" aria-pressed="${mode === 'github'}">Токен GitHub</button></div>`}
    ${mode === 'server' ? serverBlock(s) : `<p class="hint" style="margin-bottom:12px">Приватный репозиторий на GitHub, где лежат паки, материалы и файл с прогрессом.</p>
        <label class="field"><span>Репозиторий</span><input id="s-repo" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="логин/название" value="${esc(s.repo)}"></label>
    <label class="field"><span>Токен доступа</span><input id="s-token" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="github_pat_..." value="${esc(s.token)}"><small>Токен хранится только на этом телефоне.</small></label>
    <label class="field"><span>Профиль</span><input id="s-profile" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="основной" value="${esc(s.profile || '')}"><small>У каждого профиля свой прогресс, а карточки и материалы общие. Пустое поле - основной профиль.</small></label>
    ${(s.profiles || []).length > 1 || ((s.profiles || []).length === 1 && s.profiles[0] !== profKey()) ? `<div class="chips" aria-label="Профили в репозитории">${s.profiles.map((k, i) => `<button data-act="pickprofile" data-i="${i}" aria-pressed="${k === profKey()}">${esc(k || 'основной')}</button>`).join('')}</div>` : ''}
    ${S.sync.error ? `<p class="err">${esc(S.sync.error)}</p>` : ''}
    <button class="btn primary" data-act="savesync">${syncing ? 'Синхронизация…' : 'Сохранить и синхронизировать'}</button>
    <p class="kv" style="margin-top:10px">${S.sync.last ? 'Последняя синхронизация: <b>' + niceDate(ymd(new Date(S.sync.last))) + ', ' + pad(new Date(S.sync.last).getHours()) + ':' + pad(new Date(S.sync.last).getMinutes()) + '</b>' : 'Синхронизации ещё не было.'}${S.sync.dirty ? ' Есть неотправленные ответы.' : ''}</p>
    ${configured() ? '<button class="link left" data-act="setmode" data-m="server">Перейти на вход по логину и паролю</button>' : ''}`}

    <h2 class="h2">Сессия</h2>
    <div class="two"><label class="field"><span>Карточек за раз</span><input id="s-size" type="number" inputmode="numeric" min="1" max="500" value="${s.sessionSize}"></label>
    <label class="field"><span>Из них новых</span><input id="s-new" type="number" inputmode="numeric" min="0" max="500" value="${s.newPerSession}"></label></div>

    <h2 class="h2">На телефоне</h2>
    <p class="kv">Паков: <b>${packs.length}</b>, карточек: <b>${IDX.cards.length}</b>, материалов: <b>${nMat}</b>, карточек с прогрессом: <b>${nProg}</b></p>
    <p class="kv">Защита от очистки: <b>${persisted === null ? 'проверяю' : persisted ? 'включена' : 'не выдана'}</b>${persisted === false ? '. Открывай приложение с иконки на экране «Домой».' : ''}</p>
    ${packs.length ? `<div class="rows" style="margin-top:10px">${packs.map((p, i) => `<div class="row"><span class="t">${esc(p.title)}<br><span class="hint">${p.cards.length ? cardsWord(p.cards.length) : 'только материалы'}, ${p.src === 'repo' ? 'из репозитория' : p.src === 'server' ? (p.own ? 'свой, на сервере' : 'из каталога') : 'загружен из файла'}</span></span>${p.src === 'file' ? `<button class="link danger" style="width:auto" data-act="delpack" data-i="${i}">Удалить</button>` : ''}</div>`).join('')}</div>` : ''}
    <div class="stackv" style="margin-top:16px">
      <button class="btn quiet" data-act="import">Загрузить пак, конспект или бэкап</button>
      <button class="btn quiet" data-act="backup">Сохранить бэкап в файл</button>
      <button class="link danger" data-act="reset">Сбросить весь прогресс</button>
    </div></div>`;
  SETTINGS_PACKS = packs.map(p => p.key);
  refreshChip();
  if (persisted === null && navigator.storage?.persisted) navigator.storage.persisted().then(v => { persisted = v; if (VIEW === 'settings') renderSettings(); });
}
let SETTINGS_PACKS = [];
function readSessionInputs() {
  const a = parseInt($('#s-size')?.value, 10), b = parseInt($('#s-new')?.value, 10);
  if (a > 0) S.settings.sessionSize = Math.min(500, a);
  if (b >= 0) S.settings.newPerSession = Math.min(500, b);
}
function parseRepo(v) { const m = /(?:github\.com[/:])?([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/.exec(v.trim()); return m ? m[1] + '/' + m[2] : ''; }

/* ---------- файлы: импорт и бэкап ---------- */
async function importFiles(list) {
  let packs = 0, mats = 0, restored = false; const bad = [];
  for (const f of list) {
    try {
      const text = (await f.text()).replace(/^\uFEFF/, '');
      if (/\.md$/i.test(f.name)) { const path = 'materials/' + f.name; if (S.materials[path]?.src === 'repo') { bad.push(f.name + ' (уже есть в репозитории)'); continue; } S.materials[path] = { path, src: 'file', sha: '', text }; mats++; continue; }
      const raw = JSON.parse(text);
      if (raw.kind === 'zubr-backup') {
        for (const p of raw.packs || []) if (!S.packs[p.key]) { S.packs[p.key] = { ...p, src: 'file' }; packs++; }
        for (const m of raw.materials || []) if (!S.materials[m.path]) { S.materials[m.path] = { ...m, src: 'file' }; mats++; }
        if (mergeProgress(raw.progress || {}).pulled) markDirty();
        restored = true; continue;
      }
      const key = 'packs/' + f.name;
      if (S.packs[key]?.src === 'repo') { bad.push(f.name + ' (уже есть в репозитории)'); continue; }
      const p = normPack(raw, f.name.replace(/\.json$/i, ''));
      if (!p.cards.length) throw new Error('пусто');
      S.packs[key] = { ...p, key, src: 'file', sha: '' }; packs++;
      if (raw.materials && typeof raw.materials === 'object') for (const [n, t] of Object.entries(raw.materials)) { const path = 'materials/' + slug(p.id) + '/' + String(n).split('/').pop().replace(/(\.md)?$/i, '.md'); if (!S.materials[path] || S.materials[path].src === 'file') { S.materials[path] = { path, src: 'file', sha: '', text: String(t) }; mats++; } }
    } catch { bad.push(f.name); }
  }
  await save('packs'); await save('materials'); await save('progress'); reindex();
  const parts = []; if (packs) parts.push(packs + ' ' + plural(packs, ['пак', 'пака', 'паков'])); if (mats) parts.push(mats + ' ' + plural(mats, ['конспект', 'конспекта', 'конспектов'])); if (restored) parts.push('прогресс из бэкапа');
  toast((parts.length ? 'Загружено: ' + parts.join(', ') + '. ' : '') + (bad.length ? 'Не прочитано: ' + bad.join(', ') : '') || 'Ничего не загружено');
  show(VIEW);
}
async function backup() {
  const data = JSON.stringify({ kind: 'zubr-backup', format: 1, created: new Date().toISOString(), progress: S.progress, packs: Object.values(S.packs), materials: Object.values(S.materials) });
  const file = new File([data], 'zubr-backup-' + today() + '.json', { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

/* ---------- действия ---------- */
document.addEventListener('click', async ev => {
  const link = ev.target.closest('#prose a');
  if (link) {
    ev.preventDefault();
    const href = link.getAttribute('href') || '';
    if (href.startsWith('#')) { const t = document.getElementById('h-' + slug(decodeURIComponent(href.slice(1)))); if (t) t.scrollIntoView(); return; }
    if (/^https?:/i.test(href)) { window.open(href, '_blank', 'noopener'); return; }
    const [file, anchor] = decodeURIComponent(href).split('#');
    const dir = readerPath.split('/').slice(0, -1); for (const seg of file.split('/')) { if (seg === '..') dir.pop(); else if (seg && seg !== '.') dir.push(seg); }
    const target = S.materials[dir.join('/')] ? dir.join('/') : findMaterial(file);
    if (target) openMaterial(target, anchor); else toast('Такого материала нет на телефоне');
    return;
  }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'tab') { if (VIEW === 'settings') { readSessionInputs(); save('settings'); } if (b.dataset.view === 'catalog' && S.settings.admin) SUGG = null; show(b.dataset.view); }
  else if (act === 'chip') { if (configured()) sync({ manual: true }); else show('settings'); }
  else if (act === 'scope') {
    if (b.dataset.t != null) S.settings.scope = { ...HOME.topics[+b.dataset.t] };
    else S.settings.scope = { pack: +b.dataset.p < 0 ? null : HOME.packs[+b.dataset.p], topic: null };
    save('settings'); const y = $('#v-home .scroll').scrollTop; renderHome(); $('#v-home .scroll').scrollTop = y;
  }
  else if (act === 'fold') {
    const key = HOME.packs[+b.dataset.p]; if (!key) return;
    S.settings.open = { ...(S.settings.open || {}), [key]: !(S.settings.open || {})[key] };
    save('settings'); const y = $('#v-home .scroll').scrollTop; renderHome(); $('#v-home .scroll').scrollTop = y;
  }
  else if (act === 'start') startSession('review');
  else if (act === 'startall') startSession('all');
  else if (act === 'reveal') { R.revealed = true; renderReview(); }
  else if (act === 'grade') grade(b.dataset.ok === '1');
  else if (act === 'pick') { if (R.picked < 0) { R.picked = +b.dataset.i; renderReview(); } }
  else if (act === 'next') grade(R.opts[R.picked].ok);
  else if (act === 'quit' || act === 'home') { R = null; sync(); show('home'); }
  else if (act === 'material') { const ref = R.cur.material; openMaterial(findMaterial(ref), ref.split('#')[1], 'review'); }
  else if (act === 'openmat') openMaterial(MATS[+b.dataset.i].path, null, 'materials');
  else if (act === 'readerback') show(readerBack);
  else if (act === 'import') { uploadMode = false; $('#file').click(); }
  else if (act === 'upload') { uploadMode = true; $('#file').click(); }
  else if (act === 'sub') {
    const c = CATV[+b.dataset.i]; if (!c) return;
    const ids = new Set(S.subs.ids); ids.has(c.id) ? ids.delete(c.id) : ids.add(c.id);
    S.subs = { ids: [...ids], ts: Date.now() }; await save('subs'); markDirty(); renderCatalog();
    if (ids.has(c.id)) toast('Скачиваю «' + c.title + '»…');
    await sync(); if (ids.has(c.id) && !S.sync.error) toast('«' + c.title + '» на телефоне');
  }
  else if (act === 'suggest') { const p = OWN[+b.dataset.i]; if (p) await act2(() => api('suggest', { id: p.id, on: b.dataset.on === '1' }), b.dataset.on === '1' ? 'Отправлено на рассмотрение' : 'Предложение отозвано'); }
  else if (act === 'delown') { const p = OWN[+b.dataset.i]; if (p && confirm('Удалить свой пак «' + p.title + '» с сервера? Прогресс по нему останется.')) await act2(() => api('deleteOwn', { id: p.id }), 'Пак удалён'); }
  else if (act === 'delownmat') { const m = OWNMAT[+b.dataset.i]; if (m && confirm('Удалить конспект «' + matTitle(m) + '»?')) await act2(() => api('deleteOwn', { path: m.path }), 'Конспект удалён'); }
  else if (act === 'publish') { const x = SUGG[+b.dataset.i]; if (x && confirm('Опубликовать «' + x.title + '» от ' + x.login + ' в каталог? Его увидят все.')) { await act2(() => api('publish', { login: x.login, id: x.id }), 'Опубликовано'); SUGG = null; renderCatalog(); } }
  else if (act === 'reject') { const x = SUGG[+b.dataset.i]; if (x && confirm('Отклонить «' + x.title + '»? Пак останется у автора.')) { await act2(() => api('reject', { login: x.login, id: x.id }), 'Отклонено'); SUGG = null; renderCatalog(); } }
  else if (act === 'setmode') { SETMODE = b.dataset.m; S.sync.error = ''; renderSettings(); }
  else if (act === 'login') {
    const server = $('#s-server').value.trim(), login = $('#s-login').value.trim().toLowerCase(), password = $('#s-pass').value;
    if (!/^https:\/\/[^\s/]+\.[^\s]+$/i.test(server) && !/^http:\/\/localhost(:\d+)?\/?$/.test(server)) { toast('Адрес сервера начинается с https://'); return; }
    if (!login || !password) { toast('Введи логин и пароль'); return; }
    const prev = { progress: S.progress, mode: S.settings.mode, login: S.settings.login };
    S.settings.server = server;
    let r;
    try { b.disabled = true; b.textContent = 'Вхожу…'; const keep = S.settings.session; S.settings.session = ''; try { r = await api('login', { login, password }); } finally { if (!r) S.settings.session = keep; } }
    catch (e) { S.sync.error = e.status === 403 ? 'Неверный логин или пароль.' : apiErrorText(e); renderSettings(); return; }
    if (prev.mode !== 'server' || prev.login !== r.login) dropRemote();
    S.settings.mode = 'server'; S.settings.login = r.login; S.settings.session = r.session; S.settings.admin = !!r.admin; SETMODE = ''; USERS = null; SUGG = null; CRED = null;
    await save('settings'); await loadProfile();
    if (!Object.keys(S.progress).length && Object.keys(prev.progress || {}).length && prev.mode !== 'server') { S.progress = { ...prev.progress }; await save('progress'); S.sync.dirty = true; }
    reindex(); S.sync.error = ''; await save('sync'); renderSettings();
    await sync({ manual: true });
    if (!S.subs.ids.length && CAT.catalog.length) show('catalog');
  }
  else if (act === 'logout') { if (!confirm('Выйти из аккаунта на этом телефоне? Скачанные паки удалятся, прогресс сохранён на сервере.')) return; if (S.sync.dirty) await sync(); S.settings.session = ''; S.settings.admin = false; dropRemote(); CAT = { catalog: [], mySugg: [], suggestions: 0 }; USERS = null; SUGG = null; await save('settings'); reindex(); S.progress = {}; renderSettings(); }
  else if (act === 'pwopen') { PWOPEN = true; renderSettings(); }
  else if (act === 'pwcancel') { PWOPEN = false; renderSettings(); }
  else if (act === 'passwd') {
    const old = $('#s-old').value, nw = $('#s-new1').value;
    if (nw.length < 8) { toast('Новый пароль - от 8 символов'); return; }
    try { const r = await api('passwd', { old, password: nw }); S.settings.session = r.session; await save('settings'); PWOPEN = false; toast('Пароль изменён. На других телефонах нужно войти заново.'); renderSettings(); } catch (e) { toast(apiErrorText(e)); }
  }
  else if (act === 'adduser' || act === 'resetpw') {
    const login = act === 'adduser' ? $('#s-newuser').value.trim().toLowerCase() : USERS[+b.dataset.i].login;
    if (act === 'adduser' && !/^[a-z0-9][a-z0-9_-]{1,31}$/.test(login)) { toast('Логин: латиница, цифры, - и _, от 2 символов'); return; }
    if (act === 'resetpw' && !confirm('Выдать ' + login + ' новый пароль? Старый перестанет работать.')) return;
    if (act === 'adduser' && Array.isArray(USERS) && USERS.some(u => u.login === login)) { toast('Такой пользователь уже есть'); return; }
    const password = genPassword();
    try { await api('addUser', { login, password }); CRED = { login, password }; USERS = null; renderSettings(); } catch (e) { toast(apiErrorText(e)); }
  }
  else if (act === 'deluser') { const u = USERS[+b.dataset.i]; if (u && confirm('Удалить пользователя ' + u.login + '? Он больше не сможет войти. Его прогресс и паки останутся в репозитории.')) { try { await api('delUser', { login: u.login }); USERS = null; renderSettings(); toast('Удалён'); } catch (e) { toast(apiErrorText(e)); } } }
  else if (act === 'credcopy') { try { await navigator.clipboard.writeText(credText()); toast('Скопировано'); } catch { const r = document.createRange(); r.selectNodeContents($('#cred')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Выделено - нажми «Скопировать»'); } }
  else if (act === 'credclose') { CRED = null; renderSettings(); }
  else if (act === 'backup') backup();
  else if (act === 'pickprofile') { $('#s-profile').value = (S.settings.profiles || [])[+b.dataset.i] || ''; toast('Нажми «Сохранить и синхронизировать», чтобы переключиться'); }
  else if (act === 'matcards') startCustom(READER_CARDS);
  else if (act === 'savesync') {
    if (syncing) { toast('Идёт синхронизация, попробуй через пару секунд'); return; }
    readSessionInputs();
    if (serverMode() && configured()) { await save('settings'); sync({ manual: true }); renderSettings(); return; }
    if (serverMode()) { dropRemote(); }
    if (S.settings.mode !== 'github') { S.settings.mode = 'github'; SETMODE = ''; await loadProfile(); }
    const repo = parseRepo($('#s-repo').value), token = $('#s-token').value.trim();
    const profile = $('#s-profile').value.trim().normalize('NFC');
    if ($('#s-repo').value.trim() && !repo) { toast('Репозиторий пишется как логин/название'); return; }
    if (profile && !slug(profile)) { toast('В имени профиля нужны буквы или цифры'); return; }
    if (slug(profile) !== profKey()) await switchProfile(profile); else S.settings.profile = profile;
    if (repo !== S.settings.repo) { S.sync = { last: 0, dirty: Object.keys(S.progress).length > 0, progressSha: '', error: '', reset: false }; for (const k of Object.keys(S.packs)) if (S.packs[k].src === 'repo') delete S.packs[k]; for (const k of Object.keys(S.materials)) if (S.materials[k].src === 'repo') delete S.materials[k]; S.images = {}; reindex(); await save('packs'); await save('materials'); await save('images'); }
    S.settings.repo = repo; S.settings.token = token; S.sync.error = '';
    await save('settings'); await save('sync');
    if (!configured()) { toast('Сохранено. Без репозитория данные живут только на телефоне.'); renderSettings(); return; }
    sync({ manual: true }); renderSettings();
  }
  else if (act === 'delpack') { const key = SETTINGS_PACKS[+b.dataset.i]; if (key && confirm('Удалить пак «' + S.packs[key].title + '» с телефона? Прогресс по его карточкам останется.')) { delete S.packs[key]; await save('packs'); reindex(); renderSettings(); } }
  else if (act === 'reset') { if (confirm('Сбросить прогресс по всем карточкам? Это нельзя отменить.')) { S.progress = {}; S.sync.reset = true; S.sync.dirty = true; await save('progress'); await save('sync'); toast('Прогресс сброшен'); renderSettings(); sync(); } }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'optmode') { S.settings.options = ev.target.checked; save('settings'); }
  else if (ev.target.id === 'file') { const files = [...ev.target.files]; ev.target.value = ''; const up = uploadMode; uploadMode = false; if (files.length) (up ? uploadFiles(files) : importFiles(files)); }
  else if (ev.target.id === 's-size' || ev.target.id === 's-new') { readSessionInputs(); save('settings'); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'matq') { matQuery = ev.target.value; drawMatList(); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { if (S.sync.dirty) sync(); } else if (Date.now() - S.sync.last > 300000 && !R) sync(); });
addEventListener('online', () => sync());
addEventListener('offline', refreshChip);

/* ---------- запуск ---------- */
(async () => {
  await loadAll(); reindex();
  if (serverMode()) { try { const c = await DB.get('cat'); if (c && Array.isArray(c.catalog)) CAT = c; } catch {} }
  show('home');
  if (navigator.storage?.persist) navigator.storage.persist().then(v => { persisted = v; }).catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  sync();
})();
</script>
